spring.application.name=tennis

server.address=127.0.0.1
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/tennis/api

server.error.include-stacktrace=never
server.error.include-message=never

# PostgreSQL connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Same-origin session; production enables Secure cookies.
server.servlet.session.cookie.name=TENNISSESSION
server.servlet.session.cookie.path=/tennis
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
