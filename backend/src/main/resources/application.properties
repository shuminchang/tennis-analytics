spring.application.name=tennis

server.address=127.0.0.1
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/tennis/api

server.error.include-stacktrace=never
server.error.include-message=never

# PostgreSQL connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Same-origin session; production enables Secure cookies.
server.servlet.session.cookie.name=TENNISSESSION
server.servlet.session.cookie.path=/tennis
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=SET statement_timeout=${DB_STATEMENT_TIMEOUT_MS:5000}; SET jit=off
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
server.tomcat.threads.max=20
server.tomcat.accept-count=30
server.tomcat.max-http-form-post-size=16KB
app.rate.requests=${APP_RATE_REQUESTS:240}
app.rate.logins=${APP_RATE_LOGINS:20}
